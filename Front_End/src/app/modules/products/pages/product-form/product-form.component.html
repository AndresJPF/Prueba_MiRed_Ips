<div class="form-container">
  <div class="form-card">
    <h2>{{ title }}</h2>

    <div class="error-message" *ngIf="error">{{ error }}</div>
    <div class="success-message" *ngIf="success">{{ success }}</div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="codigo">Código *</label>
        <input
          type="text"
          id="codigo"
          formControlName="codigo"
          placeholder="PRD-0001"
          [class.error]="productForm.get('codigo')?.invalid && productForm.get('codigo')?.touched"
        >
        <div class="error-message" *ngIf="productForm.get('codigo')?.invalid && productForm.get('codigo')?.touched">
          <span *ngIf="productForm.get('codigo')?.errors?.['required']">El código es requerido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          placeholder="Nombre del producto"
          [class.error]="productForm.get('nombre')?.invalid && productForm.get('nombre')?.touched"
        >
        <div class="error-message" *ngIf="productForm.get('nombre')?.invalid && productForm.get('nombre')?.touched">
          <span *ngIf="productForm.get('nombre')?.errors?.['required']">El nombre es requerido</span>
          <span *ngIf="productForm.get('nombre')?.errors?.['minlength']">Mínimo 3 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="categoria_id">Categoría *</label>
        <select
          id="categoria_id"
          formControlName="categoria_id"
          [class.error]="productForm.get('categoria_id')?.invalid && productForm.get('categoria_id')?.touched"
        >
          <option [ngValue]="null">Seleccionar categoría</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">
            {{ cat.nombre }}
          </option>
        </select>
        <div class="error-message" *ngIf="productForm.get('categoria_id')?.invalid && productForm.get('categoria_id')?.touched">
          <span *ngIf="productForm.get('categoria_id')?.errors?.['required']">La categoría es requerida</span>
        </div>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          rows="3"
          placeholder="Descripción del producto"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="precio">Precio *</label>
          <input
            type="number"
            id="precio"
            formControlName="precio"
            placeholder="0.00"
            step="0.01"
            [class.error]="productForm.get('precio')?.invalid && productForm.get('precio')?.touched"
          >
          <div class="error-message" *ngIf="productForm.get('precio')?.invalid && productForm.get('precio')?.touched">
            <span *ngIf="productForm.get('precio')?.errors?.['required']">El precio es requerido</span>
            <span *ngIf="productForm.get('precio')?.errors?.['min']">El precio debe ser mayor a 0</span>
          </div>
        </div>

        <div class="form-group">
          <label for="stock">Stock *</label>
          <input
            type="number"
            id="stock"
            formControlName="stock"
            placeholder="0"
            [class.error]="productForm.get('stock')?.invalid && productForm.get('stock')?.touched"
          >
          <div class="error-message" *ngIf="productForm.get('stock')?.invalid && productForm.get('stock')?.touched">
            <span *ngIf="productForm.get('stock')?.errors?.['required']">El stock es requerido</span>
            <span *ngIf="productForm.get('stock')?.errors?.['min']">El stock no puede ser negativo</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" formControlName="estado">
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" (click)="router.navigate(['/products'])" class="btn-secondary">
          Cancelar
        </button>
        <button type="submit" [disabled]="productForm.invalid || loading" class="btn-primary">
          {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
