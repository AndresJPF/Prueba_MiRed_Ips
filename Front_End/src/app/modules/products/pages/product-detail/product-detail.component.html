<div class="detail-container">
  <div class="detail-card">
    <div class="detail-header">
      <h2>Detalle de Producto</h2>
      <div class="actions">
        <a [routerLink]="['/products/edit', product?.id]" class="btn-edit">Editar</a>
        <button (click)="deleteProduct()" class="btn-delete">Eliminar</button>
        <a routerLink="/products" class="btn-secondary">Volver</a>
      </div>
    </div>

    <div class="error-message" *ngIf="error">{{ error }}</div>

    <div *ngIf="loading">
      <app-loading-spinner></app-loading-spinner>
    </div>

    <div *ngIf="!loading && product">
      <div class="detail-grid">
        <div class="detail-item">
          <label>Código</label>
          <p>{{ product.codigo }}</p>
        </div>
        <div class="detail-item">
          <label>Nombre</label>
          <p>{{ product.nombre }}</p>
        </div>
        <div class="detail-item">
          <label>Categoría</label>
          <p>{{ getCategoryName(product.categoria_id) }}</p>
        </div>
        <div class="detail-item">
          <label>Estado</label>
          <p><span [class]="'badge badge-' + product.estado">{{ product.estado }}</span></p>
        </div>
        <div class="detail-item">
          <label>Precio</label>
          <p>${{ product.precio | number:'1.2-2' }}</p>
        </div>
        <div class="detail-item">
          <label>Stock</label>
          <p>{{ product.stock }}</p>
        </div>
        <div class="detail-item full-width">
          <label>Descripción</label>
          <p>{{ product.descripcion || 'Sin descripción' }}</p>
        </div>
      </div>
    </div>

    <div *ngIf="!loading && !product && !error">
      <p class="empty-message">Producto no encontrado</p>
    </div>
  </div>
</div>
