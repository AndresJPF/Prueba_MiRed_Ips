<div class="page-container">
  <div class="page-header">
    <h1>Gestión de Usuarios</h1>
    <a routerLink="/users/new" class="btn-primary">+ Nuevo Usuario</a>
  </div>

  <div class="error-message" *ngIf="error">{{ error }}</div>

  <div *ngIf="loading">
    <app-loading-spinner></app-loading-spinner>
  </div>

  <div *ngIf="!loading && users.length === 0">
    <p class="empty-message">No hay usuarios registrados</p>
  </div>

  <div class="table-container" *ngIf="!loading && users.length > 0">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Fecha Registro</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><span [class]="'badge badge-' + user.role">{{ user.role }}</span></td>
          <td>{{ user.created_at | date:'dd/MM/yyyy' }}</td>
          <td class="actions">
            <a [routerLink]="['/users', user.id]" class="btn-view">Ver</a>
            <a [routerLink]="['/users/edit', user.id]" class="btn-edit">Editar</a>
            <button (click)="deleteUser(user.id)" class="btn-delete">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <app-pagination
    [currentPage]="currentPage"
    [total]="total"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
  ></app-pagination>
</div>
