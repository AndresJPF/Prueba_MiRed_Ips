<div class="form-container">
  <div class="form-card">
    <h2>{{ title }}</h2>

    <div class="error-message" *ngIf="error">{{ error }}</div>
    <div class="success-message" *ngIf="success">{{ success }}</div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          [class.error]="userForm.get('name')?.invalid && userForm.get('name')?.touched"
        >
        <div class="error-message" *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched">
          <span *ngIf="userForm.get('name')?.errors?.['required']">El nombre es requerido</span>
          <span *ngIf="userForm.get('name')?.errors?.['minlength']">Mínimo 3 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          [class.error]="userForm.get('email')?.invalid && userForm.get('email')?.touched"
        >
        <div class="error-message" *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
          <span *ngIf="userForm.get('email')?.errors?.['required']">El correo es requerido</span>
          <span *ngIf="userForm.get('email')?.errors?.['email']">Ingresa un correo válido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">{{ isEdit ? 'Contraseña (dejar en blanco para no cambiar)' : 'Contraseña' }}</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          [class.error]="userForm.get('password')?.invalid && userForm.get('password')?.touched"
        >
        <div class="error-message" *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
          <span *ngIf="userForm.get('password')?.errors?.['required']">La contraseña es requerida</span>
          <span *ngIf="userForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <div class="form-group">
        <label for="role">Rol</label>
        <select id="role" formControlName="role">
          <option value="empleado">Empleado</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" (click)="router.navigate(['/users'])" class="btn-secondary">
          Cancelar
        </button>
        <button type="submit" [disabled]="userForm.invalid || loading" class="btn-primary">
          {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
